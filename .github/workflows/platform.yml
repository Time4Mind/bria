name: Platform build matrix
# Action commit SHAs below were resolved from official actions/* tag refs on 2026-09-03.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  TMPDIR: /tmp

jobs:
  classify:
    name: classify-platform-scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: go
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore classifier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/go-mod
            .cache/go-build
          key: bria-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-classifier-${{ hashFiles('go.mod', 'go.sum', 'scripts/**/*.go') }}
          restore-keys: |
            bria-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-classifier-
      - id: scope
        name: Classify changed paths fail closed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          base_sha="$PUSH_BEFORE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          if [ -n "$base_sha" ] &&
             ! printf '%s' "$base_sha" | grep -Eq '^0+$' &&
             git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$base_sha" "$HEAD_SHA" >"$changed_paths"
          else
            : >"$changed_paths"
          fi
          scope="$(GOENV=off GOTOOLCHAIN=local GOWORK=off GOPROXY=off GOSUMDB=off \
            go run -mod=readonly ./scripts ci-scope <"$changed_paths")"
          case "$scope" in
            docs-only|full) ;;
            *) printf 'invalid CI scope: %s\n' "$scope" >&2; exit 1 ;;
          esac
          printf 'scope=%s\n' "$scope" >>"$GITHUB_OUTPUT"

  test_native:
    name: test-native (${{ matrix.runner }})
    needs: classify
    if: needs.classify.outputs.scope != 'docs-only'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore native Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/go-mod
            .cache/go-build
          key: bria-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-native-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Prepare native test dependencies
        run: |
          printf 'TMPDIR=%s\n' "$(cd /tmp && pwd -P)" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Linux" ] && ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          elif ! command -v tmux >/dev/null; then
            brew install tmux
          fi
          make prepare-deps
      - name: Test native runtime
        env:
          GOENV: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOPROXY: "off"
          GOSUMDB: "off"
          CGO_ENABLED: "0"
        run: go test -mod=readonly ./...
      - name: Build executable trio
        env:
          GOENV: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOPROXY: "off"
          GOSUMDB: "off"
          CGO_ENABLED: "0"
        run: |
          go build -mod=readonly -trimpath -buildvcs=false -o bin/bria ./cmd/bria
          go build -mod=readonly -trimpath -buildvcs=false -o bin/bria-codex-adapter ./cmd/bria-codex-adapter
          go build -mod=readonly -trimpath -buildvcs=false -o bin/bria-claude-adapter ./cmd/bria-claude-adapter

  cross_compile_supported_targets:
    name: cross-compile-supported-targets (${{ matrix.goos }}, ${{ matrix.goarch }})
    needs: classify
    if: needs.classify.outputs.scope != 'docs-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore cross-compile Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/go-mod
            .cache/go-build
          key: bria-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-cross-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Prepare pinned Go modules
        run: make prepare-deps
      - name: Cross-compile executable trio
        env:
          GOENV: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOPROXY: "off"
          GOSUMDB: "off"
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -mod=readonly -trimpath -buildvcs=false -o bin/bria ./cmd/bria
          go build -mod=readonly -trimpath -buildvcs=false -o bin/bria-codex-adapter ./cmd/bria-codex-adapter
          go build -mod=readonly -trimpath -buildvcs=false -o bin/bria-claude-adapter ./cmd/bria-claude-adapter

  wsl_contract:
    name: wsl-contract
    needs: classify
    if: needs.classify.outputs.scope != 'docs-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate WSL service scaffold
        run: ./packaging/test_contracts.sh
      - name: State evidence boundary
        run: echo 'WSL runtime acceptance requires a real WSL host and is not claimed by this Linux CI job.'

  docker_build:
    name: docker-build
    needs: classify
    if: needs.classify.outputs.scope != 'docs-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build non-root role-selected image without publishing
        run: docker build --build-arg VERSION=0.0.0-ci --build-arg REVISION=${GITHUB_SHA} --tag bria:ci .
      - name: Check configured runtime identity
        run: |
          test "$(docker image inspect bria:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect bria:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect bria:ci --format '{{index .Config.Labels "io.time4mind.bria.role-selection"}}')" = 'config-and-fail-closed-preflight'

  validate_platform:
    name: validate-platform
    needs:
      - classify
      - test_native
      - cross_compile_supported_targets
      - wsl_contract
      - docker_build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the selected platform gate
        shell: bash
        env:
          SCOPE: ${{ needs.classify.outputs.scope }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          NATIVE_RESULT: ${{ needs.test_native.result }}
          CROSS_RESULT: ${{ needs.cross_compile_supported_targets.result }}
          WSL_RESULT: ${{ needs.wsl_contract.result }}
          DOCKER_RESULT: ${{ needs.docker_build.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          case "$SCOPE" in
            docs-only)
              test "$NATIVE_RESULT" = skipped
              test "$CROSS_RESULT" = skipped
              test "$WSL_RESULT" = skipped
              test "$DOCKER_RESULT" = skipped
              ;;
            full)
              test "$NATIVE_RESULT" = success
              test "$CROSS_RESULT" = success
              test "$WSL_RESULT" = success
              test "$DOCKER_RESULT" = success
              ;;
            *)
              printf 'invalid or missing CI scope: %s\n' "$SCOPE" >&2
              exit 1
              ;;
          esac
