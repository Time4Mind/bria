name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 git --no-banner --redact .
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  portable:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: scripts/build-release.sh dist
        env:
          BRIA_VERSION: ${{ github.ref_name }}
          BRIA_TARGETS: linux amd64;linux arm64;windows amd64
      - uses: actions/upload-artifact@v4
        with:
          name: portable-releases
          path: dist/*.tar.gz

  macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: scripts/build-macos-release.sh dist
        env:
          BRIA_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.tar.gz

  publish:
    needs: [portable, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release*'
          path: dist
          merge-multiple: true
      - name: Sign release manifest
        env:
          RELEASE_KEY: ${{ secrets.BRIA_RELEASE_SIGNING_KEY }}
          MINIMUM_NODE_PROTOCOL: ${{ vars.BRIA_MINIMUM_NODE_PROTOCOL || '2' }}
        run: |
          test -n "$RELEASE_KEY"
          umask 077
          printf '%s' "$RELEASE_KEY" > "$RUNNER_TEMP/bria-release.key"
          go run ./scripts/release-manifest \
            --version "$GITHUB_REF_NAME" \
            --directory dist \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --private-key "$RUNNER_TEMP/bria-release.key" \
            --minimum-node-protocol "$MINIMUM_NODE_PROTOCOL" \
            --output dist/release-manifest.json
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/release-manifest.json --verify-tag
