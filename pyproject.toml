[project]
name = "bria"
version = "0.1.0.dev0"
description = "Bria multi-host control plane for coding CLI sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22,<23",
    "websockets>=17,<18",
]

[project.scripts]
bria = "bria.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
